# each source has its own yaml file
#1 way to test is in yaml
#2nd way is to use test file

#tests
# not null test
# unique can make uqieu col
# accepted values (can give some 3-5)
# referential integrity (like foreign key)
version: 2
sources:
  - name: raw
    # Logical name used in source() calls
    database: training_db
    schema: PUBLIC
    tables:
      - name: orders
        description: 'Raw orders loaded from the e-commerce platform'
        loaded_at_field: updated_at
        # Field used for freshness checks
        freshness:
          warn_after: {count: 12, period: hour}
          # Warn if no new data in 12 hours
          error_after: {count: 24, period: hour}
          # Error if no new data in 24 hours
        columns:
          name: order_id
          description: 'Primary key for orders'
          tests:
            - not_null
            - unique

      - name: customers
        description: 'Raw customer records from CRM'
        loaded_at_field: updated_a